server {
    # 监听 80 端口，这是标准的 HTTP 访问端口
    listen 80 default_server;

    # 监听的服务器 IP 地址或域名
    server_name 13.60.21.225; 
    # !!! 请务必替换成你自己的 EC2 公网 IP !!!

    # --- 规则 1: 处理前端静态文件 ---
    # 匹配所有不以 /api/ 开头的请求
    location / {
        # 指定存放前端文件的根目录
        root /home/ubuntu/frontend;
        
        # 关键配置，用于支持 Angular 的路由
        # 当用户直接访问或刷新 /dashboard 这样的路径时，Nginx 最终会返回 index.html
        # 剩下的路由工作就交给了浏览器里的 Angular Router
        try_files $uri $uri/ /index.html;
    }

    # --- 规则 2: 处理后端 API 请求 ---
    # 匹配所有以 /api/ 开头的请求
    location /api/ {
        # 将这些请求“反向代理”给我们内部运行的 Spring Boot 服务
        proxy_pass http://127.0.0.1:8080;
        
        # 标准的代理配置头
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
